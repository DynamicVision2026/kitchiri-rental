# 原状回復（退去）判定エンジン — 日本語文言バンク
#
# エンジンは自由記述の文字列ではなく「理由コード」を返します。ここはその表示文言を
# 定義する唯一の場所です。{name} はエンジンから渡される差し込み値です。
#
# en.yaml とキー集合が完全に一致している必要があります（npm run validate:phrases で検査）。
# 新しい理由コードを追加したときは、両方のファイルに追加してください。

common:
  no_pattern: 該当する特約パターンを判別できませんでした。

# P1 明確性 — 対象範囲と金額が契約時点で特定されていたか
p1:
  deferred: 対象範囲または金額が退去後に貸主側で決められる内容です。契約時点で負担額を知ることができません。
  bare_fee_no_service: 金額の記載はありますが、その費用が何の対価なのかが特定されていません。P1は金額だけでなく範囲の特定も求めます。
  states_unit_price: 単価が明記されています。
  states_amount: 金額が明記されています。
  states_rent_multiple: 賃料の月数による算定方法が明記されており、金額を計算できます。
  declared_fixed: 条項自体に金額の記載はありませんが、契約書または別紙に金額・単価が定められているとのご回答です。
  declared_not_fixed: 条項にも契約書のどこにも金額の定めがないため、契約時点で負担額を知ることができません。
  unknown: 条項内に金額・単価の記載が見当たりません。別紙で定められている可能性があるため、確認が必要です。

# P2 所在 — 契約書上のどこに記載され、合意されたか
p2:
  agreed: "{placement}に記載されており、契約上の合意として扱われます。"
  not_agreed: "{placement}にのみ記載されています。契約上の負担として合意されたとは認められない可能性があります。"
  unknown: 記載されていた書面が未入力です。契約書のどこに書かれていたかをご確認ください。

# P3 相当性 — 金額が判例・ガイドラインの目安の範囲内か
p3:
  no_band: このパターンには金額の目安が設定されていません。金額の相当性は主たる争点ではありません。
  insufficient_context: 金額を目安と比較するための情報（賃料・請求額・間取り・単価など）が不足しています。
  measured: "測定値 {measured} を{band}の目安と比較しました（相当 {supported} 以下／上限 {elevated}）。判定：{level}。"

# P4 民法621条 — 通常損耗・経年変化の原則を有効に上書きできているか
p4:
  no_performance: 施工の有無にかかわらず費用が発生する内容です。対価となる役務がない以上、原状回復費用とはいえず、法律上の負担区分を覆すことはできません。
  disclaims_without_assent: 入居期間・経過年数・損耗の程度を問わず負担させる内容でありながら、説明や同意の記録がありません。最判平成17年12月16日の基準では民法621条の原則を覆せません。
  fails_p1_p2: 有効な上書きの前提となる明確性または合意の要件を満たしていません。
  valid_override: 内容が特定され契約上も合意されており、経過年数を無条件に排除する定めもありません。
  depends_on_p1_p2: P1・P2の判定が未確定のため、本要件も確定できません。
  notice_stacked_on_penalty: 違約金に加えて解約予告期間が定められており、同一の中途解約について二重の負担が生じます。消費者契約法9条は違約金を平均的な損害の額までに制限しています。
  shifts_ordinary_wear: 通常損耗・経年変化に相当する部分まで賃借人の負担と定めており、説明や同意の記録もありません。民法621条は通常損耗・経年変化を賃借人の負担から明文で除外しています。

# 差し込み語彙 — 本文中の {placement} / {band} / {level} に展開されます。
# エンジンは識別子のみを渡し、表示語はここで解決します。
placement:
  lease_body: 賃貸借契約書の本体
  signed_rider: 署名・押印した特約書面
  explanatory_document: 重要事項説明書
  house_rules: 入居のしおり・管理規約
  unknown: 記載書面が未確認

band:
  shikibiki: 敷引・敷金償却
  koshinryo: 更新料
  cleaning: ハウスクリーニング費用
  tatami: 畳表替え単価
  cross: クロス張替え単価
  flooring: 床材補修単価
  kagi: 鍵交換費用
  shoudoku: 室内消毒施工費
  tanki_kaiyaku: 短期解約違約金

level:
  supported: 相当な範囲内
  elevated: やや高額（判例の射程の上限付近）
  excessive: 高額に過ぎる
  not_computable: 算定不能

# 交渉文面（原状回復費用に関する確認・再検討申入書）の構成要素。
# 送付先は貸主・管理会社であり、断定ではなく「確認と再検討のお願い」として構成します。
# 当方の判定は確率的な評価であり、断定的な法的主張を装うべきではないためです。
letter:
  subject: 原状回復費用に関する確認および再検討のお願い
  greeting: 拝啓　時下ますますご清栄のこととお慶び申し上げます。平素より格別のご高配を賜り、厚く御礼申し上げます。
  intro: "さて、このたび下記物件の明渡しに伴い、原状回復費用として下記のとおりご請求（またはご提示）をいただきました。つきましては、その負担区分について確認させていただきたく、本書面を差し上げる次第です。"
  body_lead: 下記の条項およびご請求内容につきまして、当方といたしましては次のとおり理解しております。ご確認のうえ、ご再検討いただけますと幸いです。
  record_header: 記
  section_property: 対象物件
  section_clause: 対象条項
  section_position: 当方の理解
  section_request: お願いする事項
  request_itemise: 当該費用について、対象箇所・数量・単価および経過年数に応じた減価の計算根拠を記載した明細をご提示いただきたく存じます。
  request_reconsider: 上記の負担区分を踏まえ、ご請求額の再検討をお願いしたく存じます。
  request_reply: 誠に恐れ入りますが、本書面到達後2週間以内に書面またはメールにてご回答いただけますと幸いです。
  closing: 本書面は、法的な請求や紛争を意図するものではなく、負担区分の確認と円満な解決をお願いするものです。ご多忙のところ恐縮ですが、何卒よろしくお願い申し上げます。
  complimentary_close: 敬具
  placeholder_landlord: 【貸主・管理会社名】
  placeholder_address: 【ご住所】
  placeholder_name: 【お名前】
  placeholder_property: 【物件名・部屋番号】
  footer_note: "※本書面は自動生成された草案です。送付前に内容をご確認のうえ、必要に応じて専門家にご相談ください。"

# 判定ごとの「当方の理解」本文
position:
  unenforceable: 当該条項は、通常損耗・経年変化に相当する部分まで賃借人の負担とする内容と解されます。民法621条は、通常の使用及び収益によって生じた損耗並びに経年変化を賃借人の原状回復義務の対象から除外しており、これを賃借人の負担とするには、特約として有効に成立していることが必要と理解しております。
  severable: 当該条項のうち、通常損耗・経年変化に相当する部分については、民法621条により賃借人の原状回復義務の対象外と理解しております。他方、当方の故意または過失により生じた毀損については、引き続き負担すべきものと認識しております。
  reducible: 当該条項の効力自体を争うものではありませんが、ご請求額が同種の費用として一般に相当とされる水準を上回っているのではないかと考えております。

# 引用（検証済みの根拠のみを掲載します）
cite:
  civil_621: "民法第621条は、賃借人の原状回復義務について「通常の使用及び収益によって生じた賃借物の損耗並びに賃借物の経年変化を除く」と定めています。"
  h17: 通常損耗を賃借人の負担とする特約については、賃借人が負担する範囲が契約書自体に具体的に明記されているか、明記がない場合には賃貸人が口頭で説明し賃借人がこれを明確に認識して合意した場合に限り効力を有すると解されています（最高裁平成17年12月16日判決）。
  guideline: 国土交通省「原状回復をめぐるトラブルとガイドライン（再改訂版）」は、経過年数に応じた減価を考慮し、耐用年数経過後の残存価値を1円として負担割合を算定する考え方を示しています。
  shikibiki: 敷引特約については、敷引金の額が高額に過ぎる場合には消費者契約法第10条により無効となり得ると解されています（最高裁平成23年3月24日判決）。
